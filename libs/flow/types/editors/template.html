<template id="flow-template-editor-template">
	<style>
		:host { display: block; font: 12px system-ui, sans-serif; color: var(--flow-editor-text); }
		.layout { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(260px, 0.9fr); gap: 10px; min-height: 360px; }
		input, textarea { box-sizing: border-box; width: 100%; border: 1px solid var(--flow-editor-border-strong); background: var(--flow-editor-input-bg); color: var(--flow-editor-text-strong); border-radius: 4px; padding: 6px; font: 12px ui-monospace, monospace; }
		textarea { min-height: 180px; resize: vertical; }
		.modebar { display: flex; gap: 6px; margin-bottom: 8px; }
		.modebar button.active { background: var(--flow-editor-primary-active); border-color: var(--flow-editor-accent); color: white; }
		.simple { display: grid; grid-template-columns: 1fr; gap: 6px; margin-bottom: 8px; }
		.simple textarea { min-height: 110px; }
		.hidden { display: none !important; }
		.picker { overflow: auto; max-height: 420px; border: 1px solid var(--flow-editor-border); border-radius: 4px; padding: 8px; background: var(--flow-editor-surface); }
		details.scopeGroup { margin: 6px 0; }
		details.scopeGroup > summary { cursor: pointer; font-weight: 700; padding: 4px 0; color: var(--flow-editor-text-strong); }
		button { border: 1px solid var(--flow-editor-accent-border); background: var(--flow-editor-primary-bg); color: white; border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
		.path { display: block; width: 100%; text-align: left; margin: 0 0 4px; padding: 4px 6px; border-color: var(--flow-editor-control-border); background: var(--flow-editor-control-bg); color: var(--flow-editor-control-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		.path:hover { border-color: var(--flow-editor-accent-border); color: white; }
		.type { color: var(--flow-editor-info); }
		.hint, .empty { color: var(--flow-editor-text-muted); margin: 6px 0 0; line-height: 1.35; }
		@media (max-width: 640px) {
			.layout, .simple { grid-template-columns: minmax(0, 1fr); min-height: 0; }
			.modebar { flex-wrap: wrap; }
			button { min-height: 40px; }
			input, textarea { font-size: 16px; }
		}
	</style>
	<div class="layout">
		<div>
			<div class="modebar">
				<button data-mode="simple">Compose</button>
				<button data-mode="custom">Raw</button>
			</div>
			<div class="simple" part="simple">
				<textarea data-simple="template" placeholder="Write text and select values on the right"></textarea>
			</div>
			<textarea part="input" spellcheck="false"></textarea>
			<div class="hint">Each selected value is inserted as {{ source }} at the cursor. Plain text stays plain text.</div>
		</div>
		<div class="picker" part="picker"></div>
	</div>
</template>
<script>
	(function () {
		if (customElements.get("flow-template-editor")) {
			return;
		}

		function esc(value) {
			return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
				return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c];
			});
		}

		function groups(context) {
			var scopes = context && context.scopes || {};
			return Object.keys(scopes).map(function (scope) {
				var bucket = scopes[scope];
				return {
					scope: scope,
					paths: Array.isArray(bucket) ? bucket : bucket && bucket.paths || []
				};
			});
		}

		function targetType(propertyDefinition) {
			var type = propertyDefinition && (propertyDefinition.type || propertyDefinition.kind);
			return String(type || "unknown").toLowerCase();
		}

		function isScalarType(type) {
			return type === "string" || type === "number" || type === "integer" || type === "boolean";
		}

		function entryType(entry) {
			return typeof entry === "string" ? "unknown" : String(entry.type || "unknown").toLowerCase();
		}

		function acceptsPath(propertyDefinition, entry) {
			var wanted = targetType(propertyDefinition);
			if (!wanted || wanted === "unknown") {
				return true;
			}
			var actual = entryType(entry);
			if (isScalarType(wanted) && (actual === "object" || actual === "array")) {
				return false;
			}
			if (wanted === "array" && actual === "object") {
				return false;
			}
			if (wanted === "object" && actual === "array") {
				return false;
			}
			return true;
		}

		function renderPicker(context, propertyDefinition) {
			var html = "";
			groups(context).forEach(function (group) {
				var rows = (group.paths || []).filter(function (entry) {
					return acceptsPath(propertyDefinition, entry);
				});
				if (rows.length === 0) {
					return;
				}
				html += "<details class=\"scopeGroup\"><summary>" + esc(group.scope)
					+ " <span class=\"type\">" + rows.length + "</span></summary>";
				rows.forEach(function (entry) {
					var path = typeof entry === "string" ? entry : entry.path;
					var type = typeof entry === "string" ? "" : entry.type || "";
					html += "<button class=\"path\" data-path=\"" + esc(path) + "\">" + esc(path)
						+ (type ? " <span class=\"type\">" + esc(type) + "</span>" : "") + "</button>";
				});
				html += "</details>";
			});
			return html || "<div class=\"empty\">No known path yet.</div>";
		}

		customElements.define("flow-template-editor", class extends HTMLElement {
			constructor() {
				super();
				this._state = {};
				this._value = "";
				this._mode = "custom";
			}

			connectedCallback() {
				if (!this.shadowRoot) {
					this.attachShadow({ mode: "open" })
						.append(document.getElementById("flow-template-editor-template").content.cloneNode(true));
					this.shadowRoot.addEventListener("input", this);
					this.shadowRoot.addEventListener("click", this);
				}
				this.render();
			}

			setState(state) {
				this._state = state || {};
				if ((!this._state.context || !this._state.context.scopes) && this.flowHost && this.flowHost.request) {
					var response = this.flowHost.request("context", {});
					if (response && response.ok && response.context) {
						this._state.context = response.context;
					}
				}
				this._value = this._state.value == null ? "" : String(this._state.value);
				this._mode = "simple";
				this.render();
				this.emit();
			}

			get value() {
				return this._value || "";
			}

			handleEvent(event) {
				if (event.type === "input") {
					if (event.target && event.target.matches("[data-simple]")) {
						this.syncSimple();
					} else if (event.target && event.target.matches('[part="input"]')) {
						this._value = event.target.value;
						this.emit();
					}
					return;
				}
				if (event.type === "click") {
					var mode = event.target && event.target.getAttribute && event.target.getAttribute("data-mode");
					if (mode) {
						this._mode = mode;
						if (mode === "simple") {
							this.syncSimple();
						}
						this.render();
						return;
					}
					var button = event.target && event.target.closest && event.target.closest("button[data-path]");
					if (button) {
						this.pick(button.getAttribute("data-path") || "");
					}
				}
			}

			syncSimple() {
				var input = this.shadowRoot.querySelector("[data-simple=template]");
				this._value = input ? input.value : "";
				this.emit();
			}

			pick(path) {
				if (this._mode === "simple") {
					var input = this.shadowRoot.querySelector("[data-simple=template]");
					if (input) {
						var text = "{{ " + path + " }}";
						var start = input.selectionStart == null ? input.value.length : input.selectionStart;
						var end = input.selectionEnd == null ? start : input.selectionEnd;
						input.value = input.value.slice(0, start) + text + input.value.slice(end);
						this.syncSimple();
						this.render();
						input = this.shadowRoot.querySelector("[data-simple=template]");
						input.focus();
						input.selectionStart = input.selectionEnd = start + text.length;
					}
					return;
				}
				var textarea = this.shadowRoot.querySelector("textarea");
				var text = "{{ " + path + " }}";
				var start = textarea.selectionStart || 0;
				var end = textarea.selectionEnd || start;
				this._value = textarea.value.slice(0, start) + text + textarea.value.slice(end);
				this.render();
				textarea.focus();
				textarea.selectionStart = textarea.selectionEnd = start + text.length;
				this.emit();
			}

			emit() {
				this.dispatchEvent(new CustomEvent("flow-value", {
					bubbles: true,
					detail: { value: this.value }
				}));
			}

			render() {
				if (!this.shadowRoot) {
					return;
				}
				var simple = this.shadowRoot.querySelector(".simple");
				var textarea = this.shadowRoot.querySelector("textarea");
				this.shadowRoot.querySelectorAll("[data-mode]").forEach(function (button) {
					button.classList.toggle("active", button.getAttribute("data-mode") === this._mode);
				}, this);
				if (simple) {
					simple.classList.toggle("hidden", this._mode !== "simple");
				}
				if (textarea) {
					textarea.classList.toggle("hidden", this._mode === "simple");
					if (textarea.value !== this._value) {
						textarea.value = this._value;
					}
				}
				var template = this.shadowRoot.querySelector("[data-simple=template]");
				if (template && template.value !== this._value) template.value = this._value;
				var picker = this.shadowRoot.querySelector(".picker");
				if (picker) {
					picker.innerHTML = renderPicker(this._state.context, this._state.propertyDefinition);
				}
			}
		});
	}());
</script>

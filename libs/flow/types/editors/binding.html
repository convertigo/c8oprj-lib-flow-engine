<template id="flow-binding-editor-template">
	<style>
		:host { display: block; font: 12px system-ui, sans-serif; color: var(--flow-editor-text); }
		.modes { display: flex; gap: 4px; margin-bottom: 10px; }
		button { border: 1px solid var(--flow-editor-border-strong); border-radius: 4px; background: var(--flow-editor-control-bg); color: var(--flow-editor-control-text); padding: 6px 10px; cursor: pointer; }
		button.active { border-color: var(--flow-editor-selection-border); background: var(--flow-editor-selection-bg-strong); color: white; font-weight: 700; }
		button:disabled { cursor: default; opacity: 0.5; }
		.source { display: grid; grid-template-columns: minmax(140px, 0.7fr) minmax(240px, 1.3fr); gap: 8px; align-items: end; }
		.composer-tools { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 6px; }
		.composer-tools button { padding: 5px 8px; }
		.parts { display: grid; gap: 5px; margin-top: 8px; overflow-anchor: none; }
		.part { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 6px; align-items: center; }
		.part.has-custom { align-items: start; }
		.part-literal-custom { min-width: 0; }
		.part-kind { color: var(--flow-editor-text-muted); font-weight: 700; text-transform: uppercase; font-size: 10px; }
		.part-actions { display: flex; gap: 3px; }
		.part-actions button { min-width: 28px; padding: 4px 6px; }
		.part-source { text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.preview { margin-top: 8px; padding: 8px; border-left: 2px solid var(--flow-editor-selection-border); color: var(--flow-editor-text-muted); font: 12px ui-monospace, monospace; }
		.validation { margin-top: 6px; color: #ff9b91; line-height: 1.35; }
		.field { display: grid; gap: 4px; }
		label { color: var(--flow-editor-label); font-weight: 700; }
		input, select { box-sizing: border-box; width: 100%; border: 1px solid var(--flow-editor-border-strong); background: var(--flow-editor-input-bg); color: var(--flow-editor-text-strong); border-radius: 4px; padding: 6px; font: 12px ui-monospace, monospace; }
		input[readonly] { background: var(--flow-editor-surface); color: var(--flow-editor-readonly-text); cursor: default; }
		.path { margin-top: 10px; }
		.hint { color: var(--flow-editor-text-muted); margin-top: 6px; line-height: 1.35; }
		.direct { margin-top: 10px; padding: 10px; border: 1px solid var(--flow-editor-border-strong); border-radius: 4px; background: var(--flow-editor-control-bg); color: var(--flow-editor-text-muted); line-height: 1.4; }
		.hidden { display: none; }
		@media (max-width: 640px) {
			.modes { flex-wrap: wrap; }
			.modes button { flex: 1 1 auto; min-height: 44px; }
			.source, .part { grid-template-columns: minmax(0, 1fr); }
			.part-actions { justify-content: flex-end; }
			input, select { min-height: 44px; font-size: 16px; }
			.path { min-width: 0; }
		}
	</style>
	<div class="modes">
		<button type="button" data-mode="literal">Literal</button>
		<button type="button" data-mode="source">Source</button>
		<button type="button" data-mode="expression">Compose</button>
	</div>
	<div data-panel="literal">
		<select class="hidden" data-literal-choice aria-label="Literal choice"></select>
		<flow-literal-editor data-child="literal"></flow-literal-editor>
		<div class="hidden" data-literal-custom></div>
	</div>
	<div data-picker class="hidden">
		<div class="source">
			<div class="field"><label>Scope</label><select data-category></select></div>
			<div class="field"><label>Value</label><select data-source></select></div>
		</div>
		<div class="path"><flow-path-editor data-child="path"></flow-path-editor></div>
		<div class="direct hidden" data-direct-source></div>
		<div class="hint" data-source-hint></div>
	</div>
	<div data-panel="source"></div>
	<div data-panel="expression">
		<div class="composer-tools">
			<button type="button" data-add-part="literal">Add text</button>
			<button type="button" data-add-part="source">Add selected value</button>
			<button type="button" data-add-part="expression">Add code</button>
		</div>
		<div class="parts" data-parts></div>
		<div class="preview" data-preview></div>
		<div class="validation hidden" data-validation></div>
		<div class="hint">Text and selected values are joined automatically. Parts are evaluated from left to right as one JavaScript expression; code is only needed for operations or wrappers such as + 1, ??, [, ] or a ternary.</div>
	</div>
</template>
<script>
	(function () {
		if (customElements.get("flow-binding-editor")) return;

		var categories = ["local", "requestable", "action", "fullsync", "iteration", "event", "route"];
		var categoryLabels = {
			local: "Page variables",
			requestable: "Backend calls",
			action: "Actions",
			fullsync: "FullSync",
			iteration: "Iteration",
			event: "Event",
			route: "Current route"
		};

		function esc(value) {
			return String(value == null ? "" : value).replace(/[&<>"']/g, function (c) {
				return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c];
			});
		}

		function record(value) {
			if (value && typeof value === "object" && !Array.isArray(value)) return value;
			if (typeof value === "string" && value.trim()) {
				try {
					var parsed = JSON.parse(value);
					if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) return parsed;
				} catch (e) {}
			}
			return null;
		}

		function pathParts(path) {
			var parts = [], text = String(path || ""), token = "", i = 0;
			function push() { if (token) { parts.push({ kind: "property", name: token }); token = ""; } }
			while (i < text.length) {
				var ch = text.charAt(i);
				if (ch === ".") { push(); i++; continue; }
				if (ch !== "[") { token += ch; i++; continue; }
				push(); i++;
				while (/\s/.test(text.charAt(i))) i++;
				var quote = text.charAt(i), value = "";
				if (quote === "\"" || quote === "'") {
					i++;
					while (i < text.length && text.charAt(i) !== quote) {
						if (text.charAt(i) === "\\" && i + 1 < text.length) i++;
						value += text.charAt(i++);
					}
					i++;
				} else {
					while (i < text.length && text.charAt(i) !== "]") value += text.charAt(i++);
					value = value.trim();
				}
				while (i < text.length && text.charAt(i) !== "]") i++;
				if (text.charAt(i) === "]") i++;
				parts.push(/^\d+$/.test(value) ? { kind: "index", index: Number(value) } : { kind: "property", name: value });
			}
			push();
			return parts;
		}

		function pathText(parts) {
			var out = "";
			(parts || []).forEach(function (part) {
				if (part && part.kind === "index") { out += "[" + Number(part.index || 0) + "]"; return; }
				var name = String(part && part.name || "");
				if (!name) return;
				if (/^[A-Za-z_$][A-Za-z0-9_$]*$/.test(name)) out += (out ? "." : "") + name;
				else out += "[" + JSON.stringify(name) + "]";
			});
			return out;
		}

		function normalize(value) {
			var parsed = record(value);
			if (parsed && ["literal", "source", "expression"].indexOf(parsed.mode) !== -1) return parsed;
			if (value !== undefined && value !== null && value !== "") return { mode: "literal", value: value };
			return { mode: "source", source: { category: "requestable", actionId: "" }, path: [] };
		}

		function sources(state) {
			var definition = state && state.propertyDefinition || {};
			var info = state && state.info || {};
			var rows = state && state.bindingSources || definition.bindingSources || info.bindingSources || [];
			return Array.isArray(rows) ? rows : [];
		}

		function literalChoices(state) {
			var definition = state && state.propertyDefinition || {};
			var info = state && state.info || {};
			var values = definition["enum"] || info["enum"] || [];
			return Array.isArray(values) ? values : [];
		}

		function literalEditorTag(state) {
			var definition = state && state.propertyDefinition || {};
			var explicit = String(definition.literalEditorClass || "").trim().toLowerCase();
			if (/^flow-[a-z0-9-]+-editor$/.test(explicit) && explicit !== "flow-binding-editor") {
				return explicit;
			}
			var type = String(definition.literalType || "").trim().toLowerCase();
			var inferred = /^[a-z][a-z0-9-]*$/.test(type) ? "flow-" + type + "-editor" : "";
			return inferred && inferred !== "flow-binding-editor" && customElements.get(inferred) ? inferred : "";
		}

		function literalEditorLabel(state) {
			var definition = state && state.propertyDefinition || {};
			var type = String(definition.literalType || "").trim().toLowerCase();
			return type === "color" ? "color" : type && type !== "string" ? type : "text";
		}

		function sourceId(source) {
			if (source && source.category === "local") {
				return String(source.name || source.ownerId || source.scopeId || "");
			}
			if (source && source.category === "route") {
				return String(source.value || "route");
			}
			return String(source && (source.actionId || source.scopeId || source.instanceId || source.formId || source.ownerId || source.name || source.path) || "");
		}

		function sourceKey(source) {
			source = source || {};
			return [source.category || "", sourceId(source), source.value || "", source.operation || ""].join("|");
		}

		function sourceCategory(candidate) {
			var category = String(candidate && (candidate.category || candidate.source && candidate.source.category) || "");
			var id = String(candidate && (candidate.id || candidate.label) || "");
			return category === "action" && id.indexOf("local:") === 0 ? "local" : category;
		}

		function sourceLabel(candidate) {
			var source = candidate && (candidate.source || candidate) || {};
			if (sourceCategory(candidate) === "iteration") {
				if (source.value === "index") return "Index";
				if (source.value === "item") return "Current item";
				if (source.value === "iterable") return "Iterable";
			}
			var label = String(candidate && (candidate.label || candidate.id) || sourceId(candidate && (candidate.source || candidate)));
			if (sourceCategory(candidate) === "local" && label.indexOf("local:") === 0) {
				var parts = label.split(":");
				if (parts.length >= 3) return parts.slice(2).join(":") + " (" + parts[1] + ")";
			}
			return label;
		}

		function directSourceText(candidate) {
			var source = candidate && (candidate.source || candidate) || {};
			if (source.category === "iteration" && source.value === "index") {
				return "The index is the current item's position in this repeated list. It is used directly; no property is required.";
			}
			if (source.category === "iteration" && source.value === "iterable") {
				return "The iterable is the repeated collection. Choose length to read its item count.";
			}
			return "This value is scalar and is used directly; no property is required.";
		}

		function sourceExpression(candidate, binding) {
			var path = pathText(binding && binding.path);
			var label = candidate ? sourceLabel(candidate) : "Saved source";
			return label + (path ? (path.charAt(0) === "[" ? path : "." + path) : "");
		}

		function copy(value) {
			return value == null ? value : JSON.parse(JSON.stringify(value));
		}

		function sourcePart(binding) {
			var part = { kind: "source", source: copy(binding && binding.source || {}) };
			if (binding && Array.isArray(binding.path)) part.path = copy(binding.path);
			if (binding && Object.prototype.hasOwnProperty.call(binding, "fallback")) part.fallback = copy(binding.fallback);
			else if (binding && Array.isArray(binding.transform)) {
				var fallback = binding.transform.find(function (entry) { return entry && entry.kind === "default"; });
				if (fallback && Object.prototype.hasOwnProperty.call(fallback, "value")) part.fallback = copy(fallback.value);
			}
			return part;
		}

		function sourceSelection(binding) {
			var part = sourcePart(binding);
			return { mode: "source", source: part.source, path: part.path || [], fallback: part.fallback };
		}

		function composedParts(binding) {
			if (binding && binding.mode === "expression" && Array.isArray(binding.parts)) return binding.parts;
			if (binding && binding.mode === "expression") return [{ kind: "expression", expression: String(binding.expression || "") }];
			if (binding && binding.mode === "source") return [sourcePart(binding)];
			return [{ kind: "literal", value: binding && binding.value !== undefined ? binding.value : "" }];
		}

		function partPreview(part, allSources) {
			if (!part) return "";
			if (part.kind === "literal") return JSON.stringify(part.value);
			if (part.kind === "expression") return String(part.expression || "");
			var candidate = allSources.find(function (entry) {
				return sourceKey(entry.source || entry) === sourceKey(part.source);
			});
			return sourceExpression(candidate, part);
		}

		function composedExpression(binding) {
			var sourceIndex = 0;
			var parameters = [];
			var previous = null;
			var tokens = [];
			composedParts(binding).forEach(function (part) {
				if (!part) return "";
				var valuePart = part.kind === "literal" || part.kind === "source";
				if (valuePart && previous && (previous.kind === "literal" || previous.kind === "source" ||
					(previous.kind === "expression" && !expressionExpectsValue(previous.expression)))) tokens.push("+");
				if (part.kind === "literal") tokens.push(JSON.stringify(part.value));
				else if (part.kind === "expression") tokens.push(String(part.expression || ""));
				else {
					var parameter = "__flowSource" + sourceIndex++;
					parameters.push(parameter);
					tokens.push(parameter);
				}
				previous = part;
			});
			return { expression: tokens.join(""), parameters: parameters };
		}

		function bindingValidation(binding) {
			if (!binding || binding.mode !== "expression") return { valid: true, error: "" };
			var composed = composedExpression(binding);
			if (!composed.expression.trim()) return { valid: false, error: "The composed expression is empty." };
			try {
				Function.apply(null, composed.parameters.concat("return (" + composed.expression + ");"));
				return { valid: true, error: "" };
			} catch (error) {
				return { valid: false, error: "Invalid JavaScript expression: " + String(error && error.message || error) };
			}
		}

		function expressionExpectsValue(expression) {
			var trimmed = String(expression || "").trim();
			return !trimmed || /(?:\+\+|--|\?\?|&&|\|\||=>|[+\-*\/%?:,&|!<>=([{])$/.test(trimmed);
		}

		function appendValuePart(parts, part) {
			parts.push(part);
			return parts.length - 1;
		}
		function normalizeCompositionParts(parts) {
			return parts.filter(function (part, index) {
				if (!part || part.kind !== "expression" || String(part.expression || "").trim() !== "+") return true;
				var previous = parts[index - 1], next = parts[index + 1];
				var nextIsValue = next && (next.kind === "literal" || next.kind === "source");
				var previousHasValue = previous && (
					previous.kind === "literal" || previous.kind === "source" ||
					(previous.kind === "expression" && !expressionExpectsValue(previous.expression))
				);
				return !(previousHasValue && nextIsValue);
			});
		}

		function sourceRef(category, id, previous) {
			var out = { category: category };
			if (category === "requestable" || category === "action") out.actionId = id;
			else if (category === "fullsync") { out.actionId = id; out.operation = previous && previous.operation || "get"; }
			else if (category === "iteration") { out.scopeId = id; out.value = previous && previous.value || "item"; }
			else if (category === "event") out.value = "event";
			else if (category === "component") { out.instanceId = id; out.value = previous && previous.value || "props"; }
			else if (category === "form") { out.formId = id; out.value = previous && previous.value || "values"; }
			else if (category === "local") { out.name = id; out.scopeId = previous && previous.scopeId || ""; }
			else if (category === "route") out.value = previous && previous.value || "route";
			else if (category === "icon") { out.provider = previous && previous.provider || "mdi"; out.name = id; }
			else if (category === "asset") { out.project = previous && previous.project || ""; out.path = id; }
			return out;
		}

		customElements.define("flow-binding-editor", class extends HTMLElement {
			constructor() {
				super();
				this._state = {};
				this._binding = normalize("");
				this._selection = { mode: "source", source: { category: "requestable", actionId: "" }, path: [] };
				this._editingPartIndex = -1;
				this._sourcesKey = "";
				this._visibleSources = [];
			}

			connectedCallback() {
				if (!this.shadowRoot) {
					this.attachShadow({ mode: "open" }).append(document.getElementById("flow-binding-editor-template").content.cloneNode(true));
					this.shadowRoot.addEventListener("click", this);
					this.shadowRoot.addEventListener("input", this);
					this.shadowRoot.addEventListener("change", this);
					this.shadowRoot.addEventListener("flow-value", this);
				}
				this.render();
			}

			setState(state) {
				this._state = state || {};
				this._binding = normalize(this._state.value);
				if (this._binding.mode === "expression") {
					this._binding.parts = normalizeCompositionParts(composedParts(this._binding));
				}
				this._selection = { mode: "source", source: { category: "requestable", actionId: "" }, path: [] };
				if (this._binding.mode === "source") this._selection = copy(this._binding);
				else {
					var selectedPart = composedParts(this._binding).find(function (part) { return part && part.kind === "source"; });
					if (selectedPart) this._selection = sourceSelection(selectedPart);
				}
				this.loadSources();
				this.ensureSelection();
				this.render();
			}

			get value() { return JSON.stringify(this._binding); }
			get valid() { return bindingValidation(this._binding).valid; }
			get validationError() { return bindingValidation(this._binding).error; }

			customLiteralEditor(tag) {
				var container = this.shadowRoot && this.shadowRoot.querySelector("[data-literal-custom]");
				return this.customLiteralEditorIn(container, tag, "literal", -1);
			}

			customLiteralEditorIn(container, tag, child, index) {
				if (!container || !tag) return null;
				var editor = container.firstElementChild;
				if (!editor || editor.tagName.toLowerCase() !== tag) {
					container.replaceChildren();
					editor = document.createElement(tag);
					container.append(editor);
				}
				editor.setAttribute("data-child", child);
				if (index >= 0) editor.setAttribute("data-part-index", String(index));
				return editor;
			}

			renderPreservingScroll(activeTarget) {
				var positions = [], node = this;
				while (node) {
					if (typeof node.scrollTop === "number") positions.push([node, node.scrollLeft, node.scrollTop]);
					node = node.parentNode || node.host || null;
				}
				var x = typeof window !== "undefined" ? window.scrollX : 0;
				var y = typeof window !== "undefined" ? window.scrollY : 0;
				var selector = "";
				if (activeTarget && activeTarget.getAttribute) {
					var action = activeTarget.getAttribute("data-part-action");
					var index = activeTarget.getAttribute("data-part-index");
					var add = activeTarget.getAttribute("data-add-part");
					if (action != null && index != null) selector = '[data-part-action="' + action + '"][data-part-index="' + index + '"]';
					else if (add != null) selector = '[data-add-part="' + add + '"]';
				}
				var self = this;
				var restore = function () {
					var focus = selector && self.shadowRoot.querySelector(selector);
					if (focus && focus.focus) focus.focus({ preventScroll: true });
					positions.forEach(function (position) {
						position[0].scrollLeft = position[1];
						position[0].scrollTop = position[2];
					});
					if (typeof window !== "undefined" && window.scrollTo) window.scrollTo(x, y);
				};
				this.render();
				restore();
				if (typeof requestAnimationFrame === "function") requestAnimationFrame(restore);
				if (typeof setTimeout === "function") setTimeout(restore, 50);
			}

			loadSources() {
				if (sources(this._state).length || this._state.bindingSourcesLoading || !this.flowHost || !this.flowHost.request) return;
				var key = String(this._state.virtualPath || "") + "/" + String(this._state.property || "");
				if (key === this._sourcesKey) return;
				this._sourcesKey = key;
				var response = this.flowHost.request("bindingSources", {
					property: this._state.property || ""
				}) || {};
				if (response.ok !== false && Array.isArray(response.bindingSources)) {
					this._state.bindingSources = response.bindingSources;
				}
			}

			ensureSelection() {
				var available = sources(this._state);
				if (!available.length) return;
				var selected = available.find(function (candidate) {
					return sourceKey(candidate.source || candidate) === sourceKey(this._selection.source);
				}, this);
				if (selected) return;
				var hasSavedIdentity = sourceId(this._selection.source) || String(this._selection.source && this._selection.source.value || "");
				if (hasSavedIdentity) return;
				var first = available[0];
				this._selection = {
					mode: "source",
					source: copy(first.source || sourceRef(first.category, first.id, this._selection.source)),
					path: []
				};
				if (this._binding.mode === "source") this._binding = copy(this._selection);
			}

			handleEvent(event) {
				var mode = event.target && event.target.getAttribute && event.target.getAttribute("data-mode");
				if (event.type === "click" && mode) {
					event.preventDefault(); this.setMode(mode); this.render(); this.emit(); return;
				}
				if (event.type === "click") {
					var addKind = event.target && event.target.getAttribute && event.target.getAttribute("data-add-part");
					var partAction = event.target && event.target.getAttribute && event.target.getAttribute("data-part-action");
					var partIndex = Number(event.target && event.target.getAttribute && event.target.getAttribute("data-part-index"));
					if (addKind) {
						event.preventDefault();
						var parts = composedParts(this._binding);
						var insertedIndex = -1;
						if (addKind === "literal") insertedIndex = appendValuePart(parts, { kind: "literal", value: "" });
						else if (addKind === "expression") parts.push({ kind: "expression", expression: "" });
						else {
							var selectedSource = sources(this._state).find(function (candidate) {
								return sourceKey(candidate.source || candidate) === sourceKey(this._selection.source);
							}, this);
							if (!selectedSource) return;
							insertedIndex = appendValuePart(parts, sourcePart(this._selection));
						}
						this._binding = { mode: "expression", parts: parts };
						this._editingPartIndex = insertedIndex >= 0 ? insertedIndex : parts.length - 1;
						this.renderPreservingScroll(event.target); this.emit(); return;
					}
					if (partAction && Number.isInteger(partIndex)) {
						event.preventDefault();
						var currentParts = composedParts(this._binding);
						if (partAction === "select" && currentParts[partIndex] && currentParts[partIndex].kind === "source") {
							this._editingPartIndex = partIndex;
							this._selection = sourceSelection(currentParts[partIndex]);
						} else if (partAction === "remove") {
							currentParts.splice(partIndex, 1);
							if (!currentParts.length) currentParts.push({ kind: "literal", value: "" });
							this._editingPartIndex = -1;
						} else if (partAction === "left" && partIndex > 0) {
							var previous = currentParts[partIndex - 1]; currentParts[partIndex - 1] = currentParts[partIndex]; currentParts[partIndex] = previous;
						} else if (partAction === "right" && partIndex + 1 < currentParts.length) {
							var next = currentParts[partIndex + 1]; currentParts[partIndex + 1] = currentParts[partIndex]; currentParts[partIndex] = next;
						}
						this._binding = { mode: "expression", parts: currentParts };
						this.renderPreservingScroll(event.target); this.emit(); return;
					}
				}
				if (event.type === "flow-value") {
					var child = event.target && event.target.getAttribute && event.target.getAttribute("data-child");
					if (!child) return;
					event.stopPropagation();
					if (child === "path") {
						this._selection.path = pathParts(event.detail && event.detail.value);
						if (this._binding.mode === "source") this._binding.path = copy(this._selection.path);
						else if (Array.isArray(this._binding.parts) && this._editingPartIndex >= 0 && this._binding.parts[this._editingPartIndex]) {
							this._binding.parts[this._editingPartIndex] = sourcePart(this._selection);
						}
						this.render();
					}
					else if (child === "literal") {
						var value = event.detail && event.detail.value;
						if (event.detail && event.detail.textLiteral) this._binding.value = String(value || "");
						else try { this._binding.value = JSON.parse(value); } catch (e) { this._binding.value = value; }
					}
					else if (child === "part-literal") {
						var literalPartIndex = Number(event.target.getAttribute("data-part-index"));
						var literalParts = composedParts(this._binding);
						if (literalParts[literalPartIndex] && literalParts[literalPartIndex].kind === "literal") {
							literalParts[literalPartIndex].value = event.detail && event.detail.value;
							this._binding = { mode: "expression", parts: literalParts };
							this.updatePreview();
						}
					}
					this.emit(); return;
				}
				if (event.type !== "input" && event.type !== "change") return;
				var literalChoice = this.shadowRoot.querySelector("[data-literal-choice]");
				if (event.target === literalChoice && literalChoice.value !== "") {
					var choices = literalChoices(this._state);
					var choiceIndex = Number(literalChoice.value);
					if (choiceIndex >= 0 && choiceIndex < choices.length) this._binding.value = choices[choiceIndex];
					this.emit(); return;
				}
				var partValue = event.target && event.target.getAttribute && event.target.getAttribute("data-part-value");
				if (partValue) {
					var valueIndex = Number(event.target.getAttribute("data-part-index"));
					var valueParts = composedParts(this._binding);
					if (valueParts[valueIndex]) {
						if (valueParts[valueIndex].kind === "literal") valueParts[valueIndex].value = event.target.value;
						else if (valueParts[valueIndex].kind === "expression") valueParts[valueIndex].expression = event.target.value;
						this._binding = { mode: "expression", parts: valueParts };
						this.updatePreview(); this.emit(); return;
					}
				}
				var category = this.shadowRoot.querySelector("[data-category]");
				var selected = this.shadowRoot.querySelector("[data-source]");
				if (event.target === category) {
					var first = sources(this._state).find(function (candidate) {
						return sourceCategory(candidate) === category.value;
					});
					this._selection.source = first
						? first.source || sourceRef(first.category, first.id, this._selection.source)
						: sourceRef(category.value, "", this._selection.source);
					this._selection.path = [];
					this.applySelection();
					this.render(); this.emit(); return;
				}
				if (event.target === selected && selected.value !== "") {
					var candidate = this._visibleSources[Number(selected.value)];
					if (candidate) {
						this._selection.source = candidate.source || sourceRef(candidate.category, candidate.id, this._selection.source);
						this._selection.path = [];
						this.applySelection();
						this.render(); this.emit(); return;
					}
				}
			}

			applySelection() {
				if (this._binding.mode === "source") this._binding = copy(this._selection);
				else if (Array.isArray(this._binding.parts) && this._editingPartIndex >= 0 && this._binding.parts[this._editingPartIndex]) {
					this._binding.parts[this._editingPartIndex] = sourcePart(this._selection);
				}
			}

			setMode(mode) {
				if (mode === "literal") {
					var choices = literalChoices(this._state);
					var value = this._binding.value;
					if (value === undefined) value = choices.length ? choices[0] : "";
					this._binding = { mode: "literal", value: value };
				}
				else if (mode === "expression") this._binding = { mode: "expression", parts: composedParts(this._binding) };
				else {
					this._binding = copy(this._selection);
					this._binding.mode = "source";
				}
			}

			emit() {
				var validation = bindingValidation(this._binding);
				this.dispatchEvent(new CustomEvent("flow-value", { bubbles: true, detail: { value: this.value, valid: validation.valid, error: validation.error } }));
			}

			updatePreview() {
				var preview = this.shadowRoot && this.shadowRoot.querySelector("[data-preview]");
				if (!preview) return;
				var allSources = sources(this._state);
				var previous = null, output = [];
				composedParts(this._binding).forEach(function (part) {
					var valuePart = part && (part.kind === "literal" || part.kind === "source");
					if (valuePart && previous && (previous.kind === "literal" || previous.kind === "source" ||
						(previous.kind === "expression" && !expressionExpectsValue(previous.expression)))) output.push(" + ");
					output.push(partPreview(part, allSources));
					previous = part;
				});
				preview.textContent = output.join("") || "Empty expression";
				var validation = bindingValidation(this._binding);
				var message = this.shadowRoot.querySelector("[data-validation]");
				if (message) {
					message.classList.toggle("hidden", validation.valid);
					message.textContent = validation.error;
				}
			}

			render() {
				if (!this.shadowRoot) return;
				var self = this, mode = this._binding.mode || "source";
				this.shadowRoot.querySelectorAll("[data-mode]").forEach(function (button) { button.classList.toggle("active", button.getAttribute("data-mode") === mode); });
				this.shadowRoot.querySelectorAll("[data-panel]").forEach(function (panel) { panel.classList.toggle("hidden", panel.getAttribute("data-panel") !== mode); });
				var picker = this.shadowRoot.querySelector("[data-picker]");
				picker.classList.toggle("hidden", mode !== "source" && mode !== "expression");
				if (mode === "literal") {
					var literal = this.shadowRoot.querySelector('[data-child="literal"]');
					var choiceSelect = this.shadowRoot.querySelector("[data-literal-choice]");
					var customContainer = this.shadowRoot.querySelector("[data-literal-custom]");
					var customTag = literalEditorTag(this._state);
					var customEditor = customTag ? this.customLiteralEditor(customTag) : null;
					var choices = literalChoices(this._state);
					var hasChoices = choices.length > 0;
					if (choiceSelect) choiceSelect.classList.toggle("hidden", !hasChoices || !!customEditor);
					if (literal) literal.classList.toggle("hidden", hasChoices || !!customEditor);
					if (customContainer) customContainer.classList.toggle("hidden", !customEditor);
					if (customEditor && customEditor.setState) {
						customEditor.setState(Object.assign({}, this._state, {
							value: this._binding.value == null ? "" : String(this._binding.value)
						}));
						return;
					}
					if (hasChoices && choiceSelect) {
						var current = JSON.stringify(this._binding.value);
						var selectedIndex = choices.findIndex(function (choice) { return JSON.stringify(choice) === current; });
						choiceSelect.innerHTML = (selectedIndex < 0
							? '<option value="" selected disabled>Legacy value: ' + esc(String(self._binding.value)) + '</option>'
							: "") + choices.map(function (choice, index) {
							return '<option value="' + index + '"' + (index === selectedIndex ? " selected" : "") + '>' + esc(String(choice)) + '</option>';
						}).join("");
						return;
					}
					var literalValue = typeof this._binding.value === "string"
						? this._binding.value
						: JSON.stringify(this._binding.value);
					if (literal && literal.setState) literal.setState(Object.assign({}, this._state, {
						value: literalValue,
						textLiteral: typeof this._binding.value === "string"
					}));
					return;
				}
				if (mode === "expression") {
					var parts = composedParts(this._binding);
					this._binding = { mode: "expression", parts: parts };
					var customLiteralTag = literalEditorTag(this._state);
					var addLiteral = this.shadowRoot.querySelector('[data-add-part="literal"]');
					if (addLiteral) addLiteral.textContent = "Add " + literalEditorLabel(this._state);
					var addSource = this.shadowRoot.querySelector('[data-add-part="source"]');
					if (addSource) addSource.disabled = !sources(this._state).some(function (candidate) {
						return sourceKey(candidate.source || candidate) === sourceKey(self._selection.source);
					});
					var partsElement = this.shadowRoot.querySelector("[data-parts]");
					partsElement.innerHTML = parts.map(function (part, index) {
						var editor = part.kind === "source"
							? '<button type="button" class="part-source" data-part-action="select" data-part-index="' + index + '">' + esc(partPreview(part, sources(self._state))) + '</button>'
							: part.kind === "literal" && customLiteralTag
								? '<div class="part-literal-custom" data-part-literal-custom="' + index + '"></div>'
							: '<input data-part-value="1" data-part-index="' + index + '" value="' + esc(part.kind === "literal" ? String(part.value == null ? "" : part.value) : String(part.expression || "")) + '" placeholder="' + (part.kind === "literal" ? "Text" : "Operator or code") + '">';
						return '<div class="part' + (part.kind === "literal" && customLiteralTag ? ' has-custom' : '') + '"><span class="part-kind">' + esc(part.kind) + '</span>' + editor +
							'<span class="part-actions"><button type="button" title="Move left" data-part-action="left" data-part-index="' + index + '">&#8592;</button>' +
							'<button type="button" title="Move right" data-part-action="right" data-part-index="' + index + '">&#8594;</button>' +
							'<button type="button" title="Remove" data-part-action="remove" data-part-index="' + index + '">&#215;</button></span></div>';
					}).join("");
					if (customLiteralTag) {
						parts.forEach(function (part, index) {
							if (!part || part.kind !== "literal") return;
							var container = partsElement.querySelector('[data-part-literal-custom="' + index + '"]');
							var editor = self.customLiteralEditorIn(container, customLiteralTag, "part-literal", index);
							if (editor && editor.setState) editor.setState(Object.assign({}, self._state, {
								value: part.value == null ? "" : String(part.value)
							}));
						});
					}
					this.updatePreview();
				}
				var category = this.shadowRoot.querySelector("[data-category]");
				var allSources = sources(this._state);
				var currentCandidate = allSources.find(function (candidate) {
					return sourceKey(candidate.source || candidate) === sourceKey(self._selection.source);
				});
				var currentCategory = currentCandidate
					? sourceCategory(currentCandidate)
					: String(this._selection.source && this._selection.source.category || "requestable");
				var availableCategories = categories.filter(function (name) {
					return name === currentCategory || allSources.some(function (candidate) { return sourceCategory(candidate) === name; });
				});
				category.innerHTML = availableCategories.map(function (name) {
					return '<option value="' + esc(name) + '"' + (name === currentCategory ? " selected" : "") + '>' + esc(categoryLabels[name] || name) + '</option>';
				}).join("");
				var available = allSources.filter(function (candidate) { return sourceCategory(candidate) === currentCategory; });
				this._visibleSources = available;
				var sourceSelect = this.shadowRoot.querySelector("[data-source]");
				sourceSelect.innerHTML = available.length ? available.map(function (entry, index) {
					var selected = sourceKey(entry.source || entry) === sourceKey(self._selection.source);
					var type = entry.schema && entry.schema.type ? " — " + entry.schema.type : "";
					return '<option value="' + index + '"' + (selected ? " selected" : "") + '>' + esc(sourceLabel(entry) + type) + '</option>';
				}).join("") : '<option value="">No source available</option>';
				sourceSelect.disabled = available.length === 0;
				var selectedSource = available.find(function (entry) { return sourceKey(entry.source || entry) === sourceKey(self._selection.source); });
				var context = selectedSource && selectedSource.context || this._state.context || {};
				if (selectedSource && Array.isArray(selectedSource.paths)) context = { scopes: { source: { paths: selectedSource.paths } } };
				var path = this.shadowRoot.querySelector('[data-child="path"]');
				var pathContainer = this.shadowRoot.querySelector(".path");
				var direct = this.shadowRoot.querySelector("[data-direct-source]");
				var hint = this.shadowRoot.querySelector("[data-source-hint]");
				var hasPaths = !!(selectedSource && Array.isArray(selectedSource.paths) && selectedSource.paths.length);
				var hasSelectedPath = !!pathText(this._selection.path);
				var showPath = hasPaths || hasSelectedPath;
				pathContainer.classList.toggle("hidden", !showPath);
				direct.classList.toggle("hidden", !selectedSource || showPath);
				direct.textContent = selectedSource && !showPath ? directSourceText(selectedSource) : "";
				if (this._state.bindingSourcesLoading) hint.textContent = "Loading available values...";
				else if (this._state.bindingSourcesError) hint.textContent = "Available values could not be loaded.";
				else if (selectedSource) hint.textContent = hasPaths
					? "Choose a property from this source, or keep its root value."
					: hasSelectedPath ? "Schema unavailable; the existing property path is preserved and can be edited manually." : "";
				else hint.textContent = available.length ? "Choose a source." : "No value of this category is available here.";
				if (showPath && path && path.setState) path.setState(Object.assign({}, this._state, {
					context: context,
					value: pathText(this._selection.path),
					pickerOnly: true
				}));
			}
		});
	}());
</script>

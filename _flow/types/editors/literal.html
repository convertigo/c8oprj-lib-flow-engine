<template id="flow-literal-editor-template">
	<style>
		:host { display: block; font: 12px system-ui, sans-serif; color: var(--flow-editor-text); }
		textarea, input[type="number"], select { box-sizing: border-box; width: 100%; border: 1px solid var(--flow-editor-border-strong); background: var(--flow-editor-input-bg); color: var(--flow-editor-text-strong); border-radius: 4px; padding: 6px; font: 12px ui-monospace, monospace; }
		textarea { height: 220px; min-height: 100px; max-height: 55vh; resize: vertical; }
		input[type="number"] { min-height: 34px; }
		.boolean { display: flex; align-items: center; gap: 8px; min-height: 34px; color: var(--flow-editor-text-strong); }
		.boolean input { width: 18px; height: 18px; }
		.toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
		button { border: 1px solid var(--flow-editor-accent-border); background: var(--flow-editor-primary-bg); color: white; border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer; }
		button.secondary { background: var(--flow-editor-secondary-bg); border-color: var(--flow-editor-secondary-border); color: var(--flow-editor-secondary-text); }
		.status { color: var(--flow-editor-text-muted); margin-top: 6px; line-height: 1.35; }
		.status.error { color: var(--flow-editor-danger-text); }
		.hidden { display: none; }
		:host([data-text-literal]) textarea { height: 120px; min-height: 72px; max-height: 35vh; font-family: system-ui, sans-serif; }
	</style>
	<div class="toolbar">
		<button class="secondary" data-value="{}">{}</button>
		<button class="secondary" data-value="[]">[]</button>
		<button class="secondary" data-value="true">true</button>
		<button class="secondary" data-value="false">false</button>
		<button class="secondary" data-value="null">null</button>
		<button data-format="true">Format JSON</button>
	</div>
	<textarea part="input" spellcheck="false"></textarea>
	<input class="hidden" type="number" data-number part="input">
	<label class="boolean hidden" data-boolean><input type="checkbox">True</label>
	<select class="hidden" data-select part="input"></select>
	<div class="status" part="status"></div>
</template>
<script>
	(function () {
		if (customElements.get("flow-literal-editor")) {
			return;
		}

		customElements.define("flow-literal-editor", class extends HTMLElement {
			constructor() {
				super();
				this._value = "";
				this._textLiteral = false;
				this._literalType = "unknown";
				this._minimum = null;
				this._maximum = null;
				this._choices = [];
			}

			connectedCallback() {
				if (!this.shadowRoot) {
					this.attachShadow({ mode: "open" })
						.append(document.getElementById("flow-literal-editor-template").content.cloneNode(true));
					this.shadowRoot.addEventListener("input", this);
					this.shadowRoot.addEventListener("change", this);
					this.shadowRoot.addEventListener("click", this);
				}
				this.render();
			}

			setState(state) {
				this._value = state && state.value != null ? String(state.value) : "";
				var definition = state && state.propertyDefinition || {};
				var type = String(definition.literalType || definition.type || "").toLowerCase();
				if (!type || type === "binding" || type === "value") {
					if (typeof definition["default"] === "string") type = "string";
					else if (typeof definition["default"] === "boolean") type = "boolean";
					else if (typeof definition["default"] === "number") type = "number";
					else type = "unknown";
				}
				this._literalType = type === "integer" ? "number" : type;
				this._minimum = definition.minimum != null ? definition.minimum : definition.min;
				this._maximum = definition.maximum != null ? definition.maximum : definition.max;
				this._choices = Array.isArray(definition.enum) ? definition.enum.slice() : [];
				this._textLiteral = !!(state && state.textLiteral)
					|| this._literalType === "string"
					|| definition.literalType === "string"
					|| typeof definition["default"] === "string";
				this.render();
				this.emit();
			}

			get value() {
				return this._value || "";
			}

			handleEvent(event) {
				if (event.type === "input" && event.target && event.target.matches("textarea")) {
					this._value = event.target.value;
					this.validate();
					this.emit();
					return;
				}
				if (event.type === "input" && event.target && event.target.matches("[data-number]")) {
					this._value = event.target.value;
					this.validate();
					this.emit();
					return;
				}
				if (event.type === "change" && event.target && event.target.matches("[data-boolean] input")) {
					this._value = event.target.checked ? "true" : "false";
					this.validate();
					this.emit();
					return;
				}
				if (event.type === "change" && event.target && event.target.matches("[data-select]")) {
					this._value = event.target.value;
					this._textLiteral = this._literalType === "string";
					this.validate();
					this.emit();
					return;
				}
				if (event.type === "click") {
					var value = event.target && event.target.getAttribute && event.target.getAttribute("data-value");
					if (value !== null && value !== undefined) {
						this._value = value;
						this._textLiteral = false;
						this.render();
						this.emit();
						return;
					}
					if (event.target && event.target.getAttribute && event.target.getAttribute("data-format")) {
						this.format();
					}
				}
			}

			format() {
				try {
					this._value = JSON.stringify(JSON.parse(this.value), null, 2);
					this._textLiteral = false;
					this.render();
					this.emit();
				} catch (e) {
					this.validate();
				}
			}

			validate() {
				var status = this.shadowRoot && this.shadowRoot.querySelector(".status");
				if (!status) {
					return;
				}
				var value = this.value.trim();
				if (!value) {
					status.textContent = "";
					status.classList.remove("error");
					return;
				}
				if (this._textLiteral || this._literalType === "boolean" || this._literalType === "number" || this._choices.length) {
					status.textContent = "";
					status.classList.remove("error");
					return;
				}
				try {
					JSON.parse(value);
					status.textContent = "Valid JSON literal";
					status.classList.remove("error");
				} catch (e) {
					status.textContent = "Literal will be saved as text unless the runtime can coerce it. " + (e.message || "");
					status.classList.add("error");
				}
			}

			emit() {
				this.dispatchEvent(new CustomEvent("flow-value", {
					bubbles: true,
					detail: { value: this.value, textLiteral: this._textLiteral }
				}));
			}

			render() {
				if (!this.shadowRoot) {
					return;
				}
				var textarea = this.shadowRoot.querySelector("textarea");
				var toolbar = this.shadowRoot.querySelector(".toolbar");
				var number = this.shadowRoot.querySelector("[data-number]");
				var boolean = this.shadowRoot.querySelector("[data-boolean]");
				var booleanInput = boolean && boolean.querySelector("input");
				var select = this.shadowRoot.querySelector("[data-select]");
				var selectMode = this._choices.length > 0;
				var numberMode = this._literalType === "number";
				var booleanMode = this._literalType === "boolean";
				var jsonMode = !this._textLiteral && !numberMode && !booleanMode && !selectMode;
				this.toggleAttribute("data-text-literal", this._textLiteral);
				if (toolbar) toolbar.classList.toggle("hidden", !jsonMode);
				if (textarea) textarea.classList.toggle("hidden", numberMode || booleanMode || selectMode);
				if (number) number.classList.toggle("hidden", !numberMode || selectMode);
				if (boolean) boolean.classList.toggle("hidden", !booleanMode || selectMode);
				if (select) select.classList.toggle("hidden", !selectMode);
				if (textarea && textarea.value !== this.value) {
					textarea.value = this.value;
				}
				if (number) {
					number.value = this.value;
					if (this._minimum != null) number.min = String(this._minimum); else number.removeAttribute("min");
					if (this._maximum != null) number.max = String(this._maximum); else number.removeAttribute("max");
				}
				if (booleanInput) booleanInput.checked = this.value === "true";
				if (selectMode && select) {
					var values = this._choices.map(function (choice) { return String(choice); });
					if (this.value && values.indexOf(this.value) === -1) values.unshift(this.value);
					select.innerHTML = "";
					values.forEach(function (value) {
						var option = document.createElement("option");
						option.value = value;
						option.textContent = value;
						select.append(option);
					});
					select.value = this.value || values[0] || "";
				}
				if (textarea) {
					textarea.placeholder = this._textLiteral ? "Enter text" : "Enter a JSON value";
				}
				this.validate();
			}
		});
	}());
</script>
